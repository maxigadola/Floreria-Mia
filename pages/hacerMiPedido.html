<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="icon" href="../assets/favicon.ico">
    <!-- animate -->
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <title>Florería Mia-Hacer Mi Pedido</title>
    <meta name="description" content="Selecciona tu ramo favorito y sorprende a esa persona especial. Nuestro proceso de compra es rápido, seguro y con entrega a domicilio en Mendoza."> 
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid minav">
                <a class="navbar-brand" href="../index.html"><img src="../assets/logo_floreria.png" class="img-logo"
                        alt="Logo de la Floreria"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse navbar-propia" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link " aria-current="page" href="../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-disabled="page" href="#">Hacer Mi Pedido</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-disabled="page" href="./productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./contactos.html">Contactos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./quienesSomos.html">Quienes Somos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="hacermiPedido">
        <section class="homePage">
            <h1 class="animate__animated animate__zoomIn">Tu Ramo Ideal, Preparado Con Amor</h1>
            <h3>Hacé tu pedido de flores en minutos</p>
        </section>
        <section class="DetallesDelPedido">
            <h2>Detalles del Pedido</h2>
            <form class="formPedido" action="/submit" method="post">
                    <div class="container-input">
                        <label for="nombreCliente">Nombre y Apellido</label>
                        <input type="text" name="Nombre" id="nombreCliente" required>
                    </div>

                    <div class="container-input">
                        <label for="telefono">Telefono</label>
                        <input type="text" name="telefono" id="telefono" required>
                    </div>
                    <div class="container-input">
                        <label for="FechaDeEntrega">Fecha de Entrega</label>
                        <input type="date" name="Fecha" id="FechaDeEntrega">
                    </div>
                    <div class="container-input">
                        <label for="tipoDePedido">Método de Envío</label>
                        <select name="opcionesDePago" id="tipoDePedido" required>
                            <option value="">Elegí un Método de Envío</option>
                            <option value="efectivo">Envío a domicilio </option>
                            <option value="Transferencia">Retiro en el local</option>
                        </select>
                    </div>
                    <div class="container-input">
                        <label for="metodoDePago">Método de Pago</label>
                        <select name="opcionesDePago" id="metodoDePago" required>
                            <option value="">Elegí un método de pago</option>
                            <option value="efectivo">Pago Efectivo</option>
                            <option value="Transferencia">Mercado Pago</option>
                            <option value="tarjeta">Tarjeta de Débito o Crédito</option>
                        </select>
                    </div>
                    <div class="container-input"><label>¿Tenés algún ramo que te gustaría que hagamos?</label></div>
                    <div class="container-input">
                        <label for="imagenRamo">Subí tu imagen de referencia</label>
                        <input id="imagenRamo" type="file" accept="image/*">
                    </div>

                    <div class="container-input ">
                        <label for="mensajeEspecial">Contanos la ocasión o el mensaje que querés incluir</label>
                        <textarea name="mensaje" id="mensajeEspecial"
                            placeholder="Deja tu mensaje y nosotros nos encargamos del resto."></textarea>
                    </div>
                    <div class="boton-centro">
                        <input class="botonPedido" type="submit" value="Hacer mi pedido">
                    </div>
            </form>
            

        </section>
    </main>
    <footer>
        <!-- logo -->
        <div class="copyright-logo">
            <img class="icon" src="../assets/logo_floreria.png" alt="Logo Floreria Mia">
            <p>© Copyright 2025. Todos los Derechos Reservados.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
